<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Seu Nutri - Início</title>
</head>
<body>
    <h1>Seu Nutri</h1>
    <p th:if="${session.usuarioLogado != null}" th:text="|Bem-vindo, ${session.usuarioLogado.nome} (${session.usuarioLogado.papel})|"></p>
    <p th:if="${session.usuarioLogado == null}">Bem-vindo ao Seu Nutri. Faça login para acessar os módulos.</p>
    <ul>
        <li th:if="${session.usuarioLogado == null}"><a th:href="@{/login}">Login</a></li>
        <li th:if="${session.usuarioLogado != null and session.usuarioLogado.papel == 'ADMIN'}"><a th:href="@{/pratos}">Pratos</a></li>
        <li th:if="${session.usuarioLogado != null and session.usuarioLogado.papel == 'ADMIN'}"><a th:href="@{/usuarios}">Usuários</a></li>
        <li th:if="${session.usuarioLogado != null and session.usuarioLogado.papel == 'ADMIN'}"><a th:href="@{/ranques}">Ranques</a></li>
        <li th:if="${session.usuarioLogado != null and session.usuarioLogado.papel == 'ADMIN'}"><a th:href="@{/fichas}">Fichas</a></li>
        <li th:if="${session.usuarioLogado != null and session.usuarioLogado.papel == 'USUARIO'}"><a th:href="@{/pratos}">Pratos</a></li>
        <li th:if="${session.usuarioLogado != null and session.usuarioLogado.papel == 'USUARIO'}"><a th:href="@{/ranques}">Ranques</a></li>
        <li th:if="${session.usuarioLogado != null and session.usuarioLogado.papel == 'USUARIO'}"><a th:href="@{/fichas}">Fichas</a></li>
        <li th:if="${session.usuarioLogado != null}"><a th:href="@{/logout}">Sair</a></li>
    </ul>
</body>
</html>
