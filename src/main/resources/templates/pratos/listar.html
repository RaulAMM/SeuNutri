<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Pratos</title>
</head>
<body>
    <h1>Pratos</h1>
    <p th:if="${erro}" th:text="${erro}" style="color:red"></p>
    <a th:if="${session.usuarioLogado != null and session.usuarioLogado.papel == 'ADMIN'}" th:href="@{/pratos/novo}">Novo Prato</a>

    <form th:action="@{/pratos}" method="get" style="margin-bottom:15px">
        <label for="nome">Nome do prato:</label>
        <input type="text" id="nome" name="nome" th:value="${nome}" />
        <label for="ingredientesEvitar">Ingredientes a evitar (separados por vírgula):</label>
        <input type="text" id="ingredientesEvitar" name="ingredientesEvitar" th:value="${ingredientesEvitar}" />
        <button type="submit">Buscar</button>
        <a th:href="@{/pratos}">Limpar filtros</a>
    </form>

    <p th:if="${#lists.isEmpty(pratos)}" style="color:red">Nenhum prato encontrado</p>

    <table border="1">
        <tr>
            <th>ID</th><th>Nome</th><th>Ingredientes</th><th>Valor Nutricional</th><th>Receita</th><th>Ações</th>
        </tr>
        <tr th:each="prato : ${pratos}">
            <td th:text="${prato.id}"></td>
            <td th:text="${prato.nome}"></td>
            <td th:text="${prato.ingredientes}"></td>
            <td th:text="${prato.valorNutricional}"></td>
            <td th:text="${prato.receita}"></td>
            <td>
                <a th:if="${session.usuarioLogado != null and session.usuarioLogado.papel == 'ADMIN'}" th:href="@{/pratos/{id}/editar(id=${prato.id})}">Editar</a>
                <form th:if="${session.usuarioLogado != null and session.usuarioLogado.papel == 'ADMIN'}" th:action="@{/pratos/{id}/excluir(id=${prato.id})}" method="post" style="display:inline">
                    <button type="submit">Excluir</button>
                </form>
            </td>
        </tr>
    </table>
    <a th:href="@{/}">Voltar para a Home</a>
</body>
</html>
