<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Prato</title>
    <link th:href="@{/css/estilo.css}" rel="stylesheet">
</head>
<body>
    <header class="cabecalho" th:if="${session.usuarioLogado != null}">
        <div>
            <h1>Seu Nutri</h1>
            <p th:text="|Bem-vindo, ${session.usuarioLogado.nome} (${session.usuarioLogado.papel})|" class="usuario-info"></p>
        </div>
        <nav>
            <a th:href="@{/logout}" class="botao-sair">Sair</a>
        </nav>
    </header>

    <main>
        <h1 class="titulo-secao" th:text="${prato.id} != null ? 'Editar Prato' : 'Novo Prato'"></h1>
        <form th:action="${prato.id} != null ? '/pratos/' + ${prato.id} : '/pratos'" th:object="${prato}" method="post">
            <div class="campo">
                <label for="nome">Nome</label>
                <input type="text" id="nome" th:field="*{nome}" required/>
            </div>
            <div class="campo">
                <label for="ingredientes">Ingredientes</label>
                <input type="text" id="ingredientes" th:field="*{ingredientes}" required/>
            </div>
            <div class="campo">
                <label for="valorNutricional">Valor Nutricional</label>
                <input type="number" step="0.1" id="valorNutricional" th:field="*{valorNutricional}" required/>
            </div>
            <div class="campo">
                <label for="receita">Receita</label>
                <textarea id="receita" th:field="*{receita}" required></textarea>
            </div>
            <button type="submit" th:if="${session.usuarioLogado != null and session.usuarioLogado.papel == 'ADMIN'}" class="botao-salvar">Salvar</button>
        </form>
        <a th:href="@{/pratos}">Voltar</a>
        <a th:href="@{/}">Voltar para a Home</a>
    </main>
    <script th:src="@{/js/script.js}"></script>
</body>
</html>
