<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ficha</title>
    <link th:href="@{/css/estilo.css}" rel="stylesheet">
</head>
<body>
    <header class="cabecalho" th:if="${session.usuarioLogado != null}">
        <div>
            <h1>Seu Nutri</h1>
            <p th:text="|Bem-vindo, ${session.usuarioLogado.nome} (${session.usuarioLogado.papel})|" class="usuario-info"></p>
        </div>
        <nav>
            <a th:href="@{/logout}" class="botao-sair">Sair</a>
        </nav>
    </header>

    <main>
        <h1 class="titulo-secao">Ficha do Usuário</h1>
        <div th:if="${usuario != null}" class="card">
            <p><strong>Nome:</strong> <span th:text="${usuario.nome}"></span></p>
            <p><strong>Sexo:</strong> <span th:text="${usuario.sexo}"></span></p>
            <p><strong>Nível de Atividade:</strong> <span th:text="${usuario.nivelAtividade}"></span></p>
        </div>
        <div class="card">
            <p><strong>Faixa Calórica Diária:</strong> <span th:text="${faixa}"></span></p>
            <p><strong>Total de Calorias da Ficha:</strong> <span th:text="${totalCalorias}"></span> kcal</p>
        </div>

        <h2 class="titulo-secao">Pratos da Ficha</h2>
        <div class="tabela-container">
            <table class="tabela">
                <tr>
                    <th>Nome</th><th>Calorias (kcal)</th>
                </tr>
                <tr th:each="prato : ${ficha.pratos}">
                    <td th:text="${prato.nome}"></td>
                    <td th:text="${prato.valorNutricional}"></td>
                </tr>
            </table>
        </div>
        <a th:href="@{/fichas}">Voltar</a>
        <a th:href="@{/}">Voltar para a Home</a>
    </main>
    <script th:src="@{/js/script.js}"></script>
</body>
</html>
