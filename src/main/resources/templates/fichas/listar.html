<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Fichas</title>
</head>
<body>
    <h1>Fichas</h1>
    <p th:if="${erro}" th:text="${erro}" style="color:red"></p>
    <a th:href="@{/fichas/novo}">Nova Ficha</a>
    <table border="1">
        <tr>
            <th>IMC</th><th>Peso</th><th>CPF Usuário</th><th>ID Prato</th><th>ID Ranque</th><th>Ações</th>
        </tr>
        <tr th:each="ficha : ${fichas}">
            <td th:text="${ficha.imc}"></td>
            <td th:text="${ficha.peso}"></td>
            <td th:text="${ficha.usuarioCPF}"></td>
            <td th:text="${ficha.idPrato}"></td>
            <td th:text="${ficha.idRanque}"></td>
            <td>
                <a th:href="@{/fichas/{id}/editar(id=${ficha.usuarioCPF})}">Editar</a>
                <form th:action="@{/fichas/{id}/excluir(id=${ficha.usuarioCPF})}" method="post" style="display:inline">
                    <button type="submit">Excluir</button>
                </form>
            </td>
        </tr>
    </table>
</body>
</html>
