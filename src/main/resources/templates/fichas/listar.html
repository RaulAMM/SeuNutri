<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fichas</title>
    <link th:href="@{/css/estilo.css}" rel="stylesheet">
</head>
<body>
    <header class="cabecalho" th:if="${session.usuarioLogado != null}">
        <div>
            <h1>Seu Nutri</h1>
            <p th:text="|Bem-vindo, ${session.usuarioLogado.nome} (${session.usuarioLogado.papel})|" class="usuario-info"></p>
        </div>
        <nav>
            <a th:href="@{/logout}" class="botao-sair">Sair</a>
        </nav>
    </header>

    <main>
        <h1 class="titulo-secao">Fichas</h1>
        <p th:if="${erro}" th:text="${erro}" class="mensagem mensagem-erro"></p>
        <p th:if="${mensagem}" th:text="${mensagem}" class="mensagem mensagem-sucesso"></p>

        <div class="tabela-container">
            <table class="tabela">
                <tr>
                    <th>Usuário</th><th>Faixa Calórica</th><th>Total de Calorias</th><th>Ações</th>
                </tr>
                <tr th:each="ficha : ${fichas}">
                    <td>
                        <span th:each="usuario : ${usuarios}" th:if="${usuario.cpf} == ${ficha.usuarioCPF}" th:text="${usuario.nome}"></span>
                    </td>
                    <td th:text="${faixas[ficha.usuarioCPF]}"></td>
                    <td th:text="${totais[ficha.usuarioCPF]}"></td>
                    <td>
                        <a th:href="@{/fichas/visualizar/{id}(id=${ficha.usuarioCPF})}">Ver</a>
                    </td>
                </tr>
            </table>
        </div>

        <div th:if="${session.usuarioLogado != null and session.usuarioLogado.papel == 'ADMIN'}">
            <h2 class="titulo-secao">Usuários sem ficha</h2>
            <div class="tabela-container">
                <table class="tabela">
                    <tr>
                        <th>Usuário</th><th>Idade</th><th>Sexo</th><th>Nível de Atividade</th><th>Ação</th>
                    </tr>
                    <tr th:each="usuario : ${usuariosSemFicha}">
                        <td th:text="${usuario.nome}"></td>
                        <td th:text="${usuario.idade}"></td>
                        <td th:text="${usuario.sexo}"></td>
                        <td th:text="${usuario.nivelAtividade}"></td>
                        <td>
                            <form th:action="@{/fichas/gerar/{id}(id=${usuario.cpf})}" method="post" class="form-inline" data-confirmar="Deseja gerar ficha para este usuário?">
                                <button type="submit" class="botao">Gerar ficha</button>
                            </form>
                        </td>
                    </tr>
                </table>
            </div>
        </div>

        <div th:if="${session.usuarioLogado != null and session.usuarioLogado.papel == 'USUARIO' and fichas.isEmpty()}">
            <form th:action="@{/fichas/gerar/{id}(id=${session.usuarioLogado.cpf})}" method="post" class="form-inline" data-confirmar="Deseja gerar sua ficha?">
                <button type="submit" class="botao">Gerar ficha</button>
            </form>
        </div>
        <a th:href="@{/}">Voltar para a Home</a>
    </main>
    <script th:src="@{/js/script.js}"></script>
</body>
</html>
